name: privacy-review

on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run privacy scan
        run: |
          privacy-review-agent scan --base-ref origin/main --head-ref HEAD --format sarif --output results.sarif
          privacy-review-agent scan --base-ref origin/main --head-ref HEAD --format json --output results.json
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-review-json
          path: results.json
          retention-days: 90
      - name: Enforce rerun approval
        if: always()
        env:
          SECURITY_TEAM_SLUG: ${{ vars.SECURITY_TEAM_SLUG }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          privacy-review-agent enforce-rerun-approval --required-label privacy-rerun-approved
