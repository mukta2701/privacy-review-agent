# Sinks are current OpenAI, Anthropic and Google model calls: any argument
# tainted counts. OpenAI `responses` (`create`/`parse`/`stream`) and
# `completions.create` match only with a visible `model=` keyword (in any
# argument position), so an ordinary Django-style `survey.responses.create(...)`
# call stays silent; OpenAI `chat.completions` (`create`/`parse`/`stream`) and
# `beta.chat.completions` (`parse`/`stream`) match on any receiver (`$C`).
# Anthropic `messages.create`/`stream` require a visible `model=` keyword, so
# a Twilio SMS `client.messages.create(to=..., body=...)` does not match. Google covers
# `generate_content` and `models.generate_content`; `send_message` only counts
# on a chat assigned in the same function from `start_chat(...)` or
# `chats.create(...)`. The deprecated legacy completion call is out of
# scope and not a sink. Sources, the explicit suffix allowlist and sanitisers
# are copied unchanged from `python-raw-pii-logging` (see that file): no new
# names, no loosened boundaries. Single-function taint mode, our rules only.
rules:
- id: python-pii-in-model-prompt
  languages:
  - python
  severity: WARNING
  message: Personal data sent to a model without redaction
  metadata:
    category: PII_IN_MODEL_PROMPT
    severity: high
    confidence: high
    remediation: Redact or tokenize personal data before sending it to a model.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: $OBJ.$FIELD
    - metavariable-regex:
        metavariable: $FIELD
        regex: '[\s\S]*(?:(?<![0-9A-Za-z_])(?:email|Email|EMAIL)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|_verified(?![0-9A-Za-z_])|_address(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_])|Verified(?![0-9A-Za-z_])|Address(?![0-9A-Za-z_]))|(?<![0-9A-Za-z_])(?:phone|Phone|PHONE)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_]))|(?<![0-9A-Za-z_])(?:ssn|Ssn|SSN)(?:(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_]))|(?<![0-9A-Za-z_])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_])|(?<![0-9A-Za-z_])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_]))[\s\S]*'
    - &id001
      pattern-not-inside:
        pattern-either:
        - pattern: $Y is None
        - pattern: $Y is not None
        - pattern: $Y == $Z
        - pattern: $Y != $Z
        - pattern: $Y in $Z
        - pattern: $Y not in $Z
  - patterns:
    - pattern: $DICT[$KEY]
    - metavariable-regex:
        metavariable: $KEY
        regex: \A(?![\s\S]*\s)[\s\S]*(?:(?<![0-9A-Za-z_])(?:email|Email|EMAIL)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|_verified(?![0-9A-Za-z_])|_address(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_])|Verified(?![0-9A-Za-z_])|Address(?![0-9A-Za-z_]))|(?<![0-9A-Za-z_])(?:phone|Phone|PHONE)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_]))|(?<![0-9A-Za-z_])(?:ssn|Ssn|SSN)(?:(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_]))|(?<![0-9A-Za-z_])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_])|(?<![0-9A-Za-z_])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_]))[\s\S]*
    - *id001
  - patterns:
    - pattern: $X
    - metavariable-regex:
        metavariable: $X
        regex: \A(?=[A-Za-z_][A-Za-z0-9_]*\Z)[\s\S]*(?:(?<![0-9A-Za-z])(?:email|Email|EMAIL)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|_verified(?![0-9A-Za-z_])|_address(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_])|Verified(?![0-9A-Za-z_])|Address(?![0-9A-Za-z_]))|(?<=[a-z0-9])(?:Email|EMAIL)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|_verified(?![0-9A-Za-z_])|_address(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_])|Verified(?![0-9A-Za-z_])|Address(?![0-9A-Za-z_]))|(?<![0-9A-Za-z])(?:phone|Phone|PHONE)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_]))|(?<=[a-z0-9])(?:Phone|PHONE)(?:(?![0-9A-Za-z_])|_number(?![0-9A-Za-z_])|Number(?![0-9A-Za-z_]))|(?<![0-9A-Za-z])(?:ssn|Ssn|SSN)(?:(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_]))|(?<=[a-z0-9])(?:Ssn|SSN)(?:(?![0-9A-Za-z_])|_last4(?![0-9A-Za-z_])|Last4(?![0-9A-Za-z_]))|(?<![0-9A-Za-z])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_])|(?<=[a-z0-9])(?:First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_])|(?<![0-9A-Za-z])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_])|(?<=[a-z0-9])(?:Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z_]))[\s\S]*
    - pattern-not-inside: email.$ATTR
    - *id001
  - pattern-either:
    - pattern: req.body
    - pattern: request.body
    - pattern: req.headers
    - pattern: request.headers
  pattern-sinks:
  - pattern-either:
    - pattern: $C.chat.completions.create(...)
    - pattern: $C.chat.completions.parse(...)
    - pattern: $C.chat.completions.stream(...)
    - pattern: $C.beta.chat.completions.parse(...)
    - pattern: $C.beta.chat.completions.stream(...)
    - pattern: $C.responses.create(..., model=$M, ...)
    - pattern: $C.responses.parse(..., model=$M, ...)
    - pattern: $C.responses.stream(..., model=$M, ...)
    - pattern: $C.completions.create(..., model=$M, ...)
    - pattern: $C.messages.create(..., model=$M, ...)
    - pattern: $C.messages.stream(..., model=$M, ...)
    - pattern: $C.generate_content(...)
    - pattern: $C.models.generate_content(...)
  - patterns:
    - pattern-inside: |
        $CHAT = $M.start_chat(...)
        ...
    - pattern: $CHAT.send_message(...)
  - patterns:
    - pattern-inside: |
        $CHAT = $C.chats.create(...)
        ...
    - pattern: $CHAT.send_message(...)
  pattern-sanitizers:
  - pattern-either:
    - pattern: redact(...)
    - pattern: $U.redact(...)
    - pattern: mask(...)
    - pattern: $U.mask(...)
    - pattern: hash(...)
    - pattern: $U.hash(...)
    - pattern: tokenize(...)
    - pattern: $U.tokenize(...)
    - pattern: len(...)
    - pattern: $U.len(...)
    - pattern: bool(...)
    - pattern: $U.bool(...)
    - pattern: type(...)
    - pattern: $U.type(...)
