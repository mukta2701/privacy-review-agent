# Sensitive names (edit here to add or remove a field): email, phone, address, location, lat, lon, ssn, passport, chat, upload, cookie, token, authorization, headers, transcript, first_name, last_name.
# Standalone `name`, `message` and `body` are excluded as too generic, as are
# the identifier-only `user_id` and `customer_id`. Sinks and sanitisers are the
# `pattern-either` lists below; all four sanitisers also match as methods.
rules:
- id: js-ts-raw-pii-logging
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Raw PII written to logs without redaction
  metadata:
    category: RAW_PII_LOGGING
    severity: high
    confidence: high
    remediation: Redact or mask PII before logging.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: $OBJ.$FIELD
    - metavariable-regex:
        metavariable: $FIELD
        regex: '[\s\S]*(?:(?<![0-9A-Za-z])(?:email|Email|EMAIL)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Email|EMAIL)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:phone|Phone|PHONE)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Phone|PHONE)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:address|Address|ADDRESS)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Address|ADDRESS)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:location|Location|LOCATION)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Location|LOCATION)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:lat|Lat|LAT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Lat|LAT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:lon|Lon|LON)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Lon|LON)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:ssn|Ssn|SSN)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Ssn|SSN)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:passport|Passport|PASSPORT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Passport|PASSPORT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:chat|Chat|CHAT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Chat|CHAT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:upload|Upload|UPLOAD)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Upload|UPLOAD)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:cookie|Cookie|COOKIE)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Cookie|COOKIE)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:token|Token|TOKEN)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Token|TOKEN)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:authorization|Authorization|AUTHORIZATION)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Authorization|AUTHORIZATION)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:headers|Headers|HEADERS)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Headers|HEADERS)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:transcript|Transcript|TRANSCRIPT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Transcript|TRANSCRIPT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z]))[\s\S]*'
  - patterns:
    - pattern: $DICT[$KEY]
    - metavariable-regex:
        metavariable: $KEY
        regex: \A(?![\s\S]*\s)[\s\S]*(?:(?<![0-9A-Za-z])(?:email|Email|EMAIL)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Email|EMAIL)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:phone|Phone|PHONE)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Phone|PHONE)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:address|Address|ADDRESS)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Address|ADDRESS)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:location|Location|LOCATION)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Location|LOCATION)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:lat|Lat|LAT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Lat|LAT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:lon|Lon|LON)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Lon|LON)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:ssn|Ssn|SSN)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Ssn|SSN)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:passport|Passport|PASSPORT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Passport|PASSPORT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:chat|Chat|CHAT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Chat|CHAT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:upload|Upload|UPLOAD)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Upload|UPLOAD)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:cookie|Cookie|COOKIE)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Cookie|COOKIE)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:token|Token|TOKEN)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Token|TOKEN)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:authorization|Authorization|AUTHORIZATION)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Authorization|AUTHORIZATION)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:headers|Headers|HEADERS)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Headers|HEADERS)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:transcript|Transcript|TRANSCRIPT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Transcript|TRANSCRIPT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z]))[\s\S]*
  - patterns:
    - pattern: $X
    - metavariable-regex:
        metavariable: $X
        regex: \A(?=[A-Za-z_$][A-Za-z0-9_$]*\Z)[\s\S]*(?:(?<![0-9A-Za-z])(?:email|Email|EMAIL)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Email|EMAIL)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:phone|Phone|PHONE)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Phone|PHONE)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:address|Address|ADDRESS)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Address|ADDRESS)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:location|Location|LOCATION)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Location|LOCATION)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:lat|Lat|LAT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Lat|LAT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:lon|Lon|LON)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Lon|LON)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:ssn|Ssn|SSN)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Ssn|SSN)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:passport|Passport|PASSPORT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Passport|PASSPORT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:chat|Chat|CHAT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Chat|CHAT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:upload|Upload|UPLOAD)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Upload|UPLOAD)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:cookie|Cookie|COOKIE)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Cookie|COOKIE)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:token|Token|TOKEN)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Token|TOKEN)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:authorization|Authorization|AUTHORIZATION)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Authorization|AUTHORIZATION)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:headers|Headers|HEADERS)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Headers|HEADERS)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:transcript|Transcript|TRANSCRIPT)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Transcript|TRANSCRIPT)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<![0-9A-Za-z])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z])|(?<=[a-z0-9])(?:Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?![0-9A-Za-z]))[\s\S]*
  - pattern-either:
    - pattern: req.body
    - pattern: request.body
    - pattern: req.headers
    - pattern: request.headers
  pattern-sinks:
  - pattern-either:
    - pattern: console.log(...)
    - pattern: console.info(...)
    - pattern: console.warn(...)
    - pattern: console.error(...)
    - pattern: console.debug(...)
    - pattern: logger.debug(...)
    - pattern: logger.info(...)
    - pattern: logger.warn(...)
    - pattern: logger.error(...)
    - pattern: logger.log(...)
    - pattern: log.debug(...)
    - pattern: log.info(...)
    - pattern: log.warn(...)
    - pattern: log.error(...)
    - pattern: log.log(...)
  pattern-sanitizers:
  - pattern-either:
    - pattern: redact(...)
    - pattern: $U.redact(...)
    - pattern: mask(...)
    - pattern: $U.mask(...)
    - pattern: hash(...)
    - pattern: $U.hash(...)
    - pattern: tokenize(...)
    - pattern: $U.tokenize(...)
