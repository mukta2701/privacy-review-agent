# Sensitive names (edit here to add or remove a field): email, phone, ssn, first_name, last_name.
# Standalone `name`, `message` and `body` are excluded as too generic, as are
# the identifier-only `user_id` and `customer_id`. Also excluded, because
# ordinary code kept matching them: `upload`, `chat`, `location`, `lat`,
# `lon`, standalone `headers`, `token`, `address`, `cookie`, `transcript`,
# `passport` and `authorization` (the keyword detector still flags them
# advisory). A name ends before `_suffix` or a camelCase hump, so
# `user.phone_number`, `user.ssn_last4` and `user.emailVerified` match while
# plurals (`emails`) and run-together lowercase (`useremail`) do not.
# `len()`/`bool()` (`Boolean()` in JS/TS) sanitise, `is None`/`is not None`
# (`==`/`!=`/`===`/`!==` `null`) do not taint, and the stdlib `email` module
# used as an object (`email.utils`) is not a source. Sinks and sanitisers are
# `pattern-either` lists below; sanitisers also match as methods.
rules:
- id: js-ts-raw-pii-logging
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Raw PII written to logs without redaction
  metadata:
    category: RAW_PII_LOGGING
    severity: high
    confidence: high
    remediation: Redact or mask PII before logging.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: $OBJ.$FIELD
    - metavariable-regex:
        metavariable: $FIELD
        regex: '[\s\S]*(?:(?<![0-9A-Za-z])(?:email|Email|EMAIL)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Email|EMAIL)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:phone|Phone|PHONE)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Phone|PHONE)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:ssn|Ssn|SSN)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Ssn|SSN)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z])))[\s\S]*'
    - &id001
      pattern-not-inside:
        pattern-either:
        - pattern: $Y == null
        - pattern: $Y != null
        - pattern: $Y === null
        - pattern: $Y !== null
  - patterns:
    - pattern: $DICT[$KEY]
    - metavariable-regex:
        metavariable: $KEY
        regex: \A(?![\s\S]*\s)[\s\S]*(?:(?<![0-9A-Za-z])(?:email|Email|EMAIL)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Email|EMAIL)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:phone|Phone|PHONE)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Phone|PHONE)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:ssn|Ssn|SSN)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Ssn|SSN)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z])))[\s\S]*
    - *id001
  - patterns:
    - pattern: $X
    - metavariable-regex:
        metavariable: $X
        regex: \A(?=[A-Za-z_$][A-Za-z0-9_$]*\Z)[\s\S]*(?:(?<![0-9A-Za-z])(?:email|Email|EMAIL)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Email|EMAIL)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:phone|Phone|PHONE)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Phone|PHONE)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:ssn|Ssn|SSN)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Ssn|SSN)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:first|First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:First|FIRST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<![0-9A-Za-z])(?:last|Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z]))|(?<=[a-z0-9])(?:Last|LAST)(?:[^0-9A-Za-z]+|(?<=[a-z0-9])(?=[A-Z]))(?:name|Name|NAME)(?:(?![0-9A-Za-z_])|(?=_)|(?<=[a-z0-9])(?=[A-Z])))[\s\S]*
    - pattern-not-inside: email.$ATTR
    - *id001
  - pattern-either:
    - pattern: req.body
    - pattern: request.body
    - pattern: req.headers
    - pattern: request.headers
  pattern-sinks:
  - pattern-either:
    - pattern: console.log(...)
    - pattern: console.info(...)
    - pattern: console.warn(...)
    - pattern: console.error(...)
    - pattern: console.debug(...)
    - pattern: logger.debug(...)
    - pattern: logger.info(...)
    - pattern: logger.warn(...)
    - pattern: logger.error(...)
    - pattern: logger.log(...)
    - pattern: log.debug(...)
    - pattern: log.info(...)
    - pattern: log.warn(...)
    - pattern: log.error(...)
    - pattern: log.log(...)
  pattern-sanitizers:
  - pattern-either:
    - pattern: redact(...)
    - pattern: $U.redact(...)
    - pattern: mask(...)
    - pattern: $U.mask(...)
    - pattern: hash(...)
    - pattern: $U.hash(...)
    - pattern: tokenize(...)
    - pattern: $U.tokenize(...)
    - pattern: Boolean(...)
    - pattern: $U.Boolean(...)
